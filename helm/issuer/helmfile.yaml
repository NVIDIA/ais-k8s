environments:
  ais-asr-ngc-iad:
    values:
      - valuesPath: "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git@helm/issuer/config/ais-asr-ngc-iad.yaml?ref=main"
  ais-asr-ngc-ord:
    values:
      - valuesPath: "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git@helm/issuer/config/ais-asr-ngc-ord.yaml?ref=main"
  local: {}
  sjc11:
    kubeContext: sjc11
---
releases:
  # Defines a self-signed issuer for acquiring a tls cert
  - name: issuer
    namespace: "{{ .Values | get \"namespace\" \"cert-manager\" }}"
    createNamespace: true
    chart: issuer-chart
    version: 0.2.0
    values:
      - '{{ .Values | get "valuesPath" (printf "./config/%s.yaml" .Environment.Name) }}'
