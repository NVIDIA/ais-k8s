environments:
  # Local / sample envs — values stay in ais-k8s
  default:
    values:
      - valuesPath: ./config/operator/default.yaml
        createCert:
          enabled: false

  local:
    values:
      - valuesPath: ./config/operator/local.yaml
        createCert:
          enabled: true
          valuesPath: ./config/tls-cert/local.yaml

  keycloak:
    values:
      - valuesPath: ./config/operator/keycloak.yaml
        createCert:
          enabled: false

  # Deployed envs — all env values (valuesPath, createCert, version) in ais-infra
  oci-iad:
    values:
      - "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git@helm/operator/config/env/oci-iad.yaml?ref=main"

  oci-ord:
    values:
      - "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git@helm/operator/config/env/oci-ord.yaml?ref=main"

  oci-nrt:
    values:
      - "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git@helm/operator/config/env/oci-nrt.yaml?ref=main"

  sjc4-1000:
    values:
      - "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git@helm/operator/config/env/sjc4-1000.yaml?ref=main"

  sjc11:
    values:
      - "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git@helm/operator/config/env/sjc11.yaml?ref=main"

  sjc4-dev:
    values:
      - "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git@helm/operator/config/env/sjc4-dev.yaml?ref=main"

  sjc112:
    values:
      - "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git@helm/operator/config/env/sjc112.yaml?ref=main"
---
repositories:
  - name: aistore
    url: https://nvidia.github.io/ais-k8s/charts/

---
hooks:
  - events: ["prepare"]
    showlogs: true
    command: helmfile
    args: ["cache", "cleanup"]
  - events: ["prepare"]
    showlogs: true
    command: bash
    args: ["../confirm.sh", "{{ .Environment.Name }}"]

releases:
  - name: operator-tls-cert
    namespace: "{{ .Values | get \"namespace\" \"ais-operator-system\" }}"
    createNamespace: true
    chart: tls-cert
    condition: createCert.enabled
    version: 0.1.0
    values:
      - "{{ .Environment.Values.createCert | get \"valuesPath\" \"\" }}"

  - name: ais-operator
    namespace: "{{ .Values | get \"namespace\" \"ais-operator-system\" }}"
    createNamespace: true
    chart: aistore/ais-operator
    version: "{{ .Values | get \"version\" \"3.4.0\" }}"
    values:
      - "{{ .Environment.Values.valuesPath }}"
    hooks:
      - events: ["presync"]
        showlogs: true
        command: bash
        args: ["./check_cert_manager.sh"]
