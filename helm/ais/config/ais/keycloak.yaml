cluster: ais
mpathInfo:
  storageClass: "ais-local-storage"
  size: 5.8Ti
  # Apply shared label to run on one physical disk (for development/testing)
  mounts:
    - path: /ais/1
      label: shared
    - path: /ais/2
      label: shared
    - path: /ais/3
      label: shared
size: 3
protocol: https
tls:
  skipVerifyCert: false
  secretName: "tls-certs"
nodeImage:
  tag: v5.1
initImage:
  tag: v5.1
logSidecar:
  image:
    tag: v1.2
configToUpdate:
  backend:
    aws: {}
  auth:
    enabled: true
    oidc:
      allowed_iss: [ "https://keycloak-server-service.keycloak.svc.cluster.local:8543/realms/aistore" ]

# Sets auth.oidc.issuer_ca_bundle above with an automatic mount-point for AIS to trust the issuer
issuerCAConfigMap: aistore.nvidia.com
operatorSkipVerifyCrt: false

# Client auth API config used by the operator (see auth/keycloak/manifests/auth-profile.yaml)
auth:
  profileRef:
    name: keycloak-ais-admin
stateStorage:
  pvc:
    storageClass: "openebs-hostpath"
cleanupMetadata: true