environments:
  default: 
    values: 
      - valuesPath: "./config/alloy-config/default.yaml"
        container_runtime: containerd
  oci-ord: 
    values:
      - valuesPath:  "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git//helm/monitoring/alloy/config/@oci-ord.yaml?ref=main"
        container_runtime: crio
        host_network: true
  oci-iad:
    values:
      - valuesPath: "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git//helm/monitoring/alloy/config/@oci-iad.yaml?ref=main"
        container_runtime: crio
        host_network: true
  ais-asr-ngc-iad:
    values:
      - valuesPath: "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git//helm/monitoring/alloy/config/@ais-asr-ngc-iad.yaml?ref=main"
        container_runtime: crio
        host_network: true
  ais-asr-ngc-ord:
    values:
      - valuesPath: "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git//helm/monitoring/alloy/config/@ais-asr-ngc-ord.yaml?ref=main"
        container_runtime: crio
        host_network: true
        alloyConfigOverrides:
          scrape:
            tls:
              caConfigMap: aistore.nvidia.com
              caNamespace: monitoring
              caKey: ca.crt
              serverName: ais-target.ais
  oci-nrt:
    values:
      - valuesPath: "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git//helm/monitoring/alloy/config/@oci-nrt.yaml?ref=main"
        container_runtime: crio
        host_network: true
  sjc112: 
    values:
      - valuesPath: "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git//helm/monitoring/alloy/config/@sjc112.yaml?ref=main"
        container_runtime: containerd
  ais-qa:
    values:
      - valuesPath: "git::ssh://git@gitlab-master.nvidia.com/aistorage/ais-infra.git//helm/monitoring/alloy/config/@ais-qa.yaml?ref=main"
        container_runtime: containerd
        host_network: true
--- 

repositories:
  - name: grafana
    url: https://grafana.github.io/helm-charts

releases:
  - name: alloy-config
    namespace: monitoring
    chart: charts/alloy-config  # Local chart for configmap
    version: 0.2.0
    createNamespace: true
    values:
      - "{{ .Environment.Values.valuesPath }}"
      - ./config/alloy-config/overrides.yaml.gotmpl

  - name: alloy
    namespace: monitoring
    createNamespace: true
    chart: grafana/alloy
    version: 1.8.0
    values:
      - ./config/alloy/default.yaml.gotmpl
      - "{{ .Environment.Values.valuesPath }}"

    needs:
      - alloy-config
