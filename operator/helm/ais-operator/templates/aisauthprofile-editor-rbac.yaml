apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ais-operator.fullname" . }}-aisauthprofile-editor-role
  labels:
  {{- include "ais-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - auth.ais.nvidia.com
  resources:
  - aistoreauthprofiles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ais-operator.fullname" . }}-aisauthprofile-editor-rolebinding
  labels:
  {{- include "ais-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "ais-operator.fullname" . }}-aisauthprofile-editor-role'
subjects:
- kind: ServiceAccount
  name: '{{ include "ais-operator.serviceAccountName" . }}'
  namespace: '{{ .Release.Namespace }}'
