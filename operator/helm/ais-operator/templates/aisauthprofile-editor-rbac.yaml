apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ais-operator.fullname" . }}-aisauthprofile-editor-role
  labels:
  {{- include "ais-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - auth.ais.nvidia.com
  resources:
  - aistoreauthprofiles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
